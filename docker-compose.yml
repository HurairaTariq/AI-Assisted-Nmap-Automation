# ─── docker-compose.yml ──────────────────────────────────────
version: "3.9"

services:

  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      # Mount Docker socket so the app can spawn Kali scan containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER:     nmapuser
      POSTGRES_PASSWORD: nmappass
      POSTGRES_DB:       nmapdb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nmapuser -d nmapdb"]
      interval: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata: